name: Complete DevOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: devops-app
  ECS_SERVICE: devops-service
  ECS_CLUSTER: devops-cluster
  ECS_TASK_DEFINITION: devops-app

jobs:
  # Phase 1: Testing
  test:
    name: Phase 1 - Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server linter
        run: npm run lint
        working-directory: server

      - name: Run server tests
        run: npm run test:ci
        working-directory: server

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-report-${{ matrix.node-version }}
          path: |
            server/junit.xml
            server/coverage/

      - name: Run E2E tests
        run: |
          cd e2e
          npm ci
          npm run test:e2e || true

  # Phase 2: Terraform Infrastructure
  terraform:
    name: Phase 2 - Infrastructure (Terraform)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Setup Terraform State Bucket
        id: state-bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="devops-tf-state-${ACCOUNT_ID}"
          echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME exists."
          else
            echo "Creating bucket $BUCKET_NAME..."
            if [ "${{ secrets.AWS_REGION }}" == "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
            else
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ secrets.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}
            fi
          fi

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ steps.state-bucket.outputs.bucket }}"
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Output
        id: terraform
        run: |
          echo "ecr_repository=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
        working-directory: terraform

  # Phase 3: Docker Build & Push to ECR
  build-and-push:
    name: Phase 3 - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/devops-app:${{ github.sha }} server/
          docker tag ${{ steps.login-ecr.outputs.registry }}/devops-app:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/devops-app:latest

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/devops-app:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/devops-app:latest

      - name: Output image URI
        id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/devops-app:${{ github.sha }}" >> $GITHUB_OUTPUT

  # Phase 4: Deploy to ECS Fargate
  deploy-ecs:
    name: Phase 4 - Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update ECS task definition image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: server/ecs-task-definition.json
          container-name: devops-app
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify ECS service
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].[runningCount,desiredCount,deployments[0].status]' \
            --output text

      - name: Get ALB endpoint
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[?LoadBalancerName==`devops-alb`].DNSName' \
            --output text)
          echo "Application deployed at: http://$ALB_DNS"
          echo "ALB_ENDPOINT=http://$ALB_DNS" >> $GITHUB_ENV

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -f http://$(aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION }} --query 'LoadBalancers[?LoadBalancerName==`devops-alb`].DNSName' --output text)/health; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i: Waiting for service to be ready..."
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1
