name: Deploy to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Install Git if not present
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing Git..."
              sudo apt-get update && sudo apt-get install -y git
            fi

            # Install Node.js 20.x if not present
            if ! command -v node &> /dev/null; then
              echo "Node.js not found. Installing Node.js 20.x..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install PM2 if not present
            if ! command -v pm2 &> /dev/null; then
              echo "PM2 not found. Installing PM2 globally..."
              sudo npm install -g pm2
            fi

            # Navigate to the application directory (idempotent: create if missing)
            mkdir -p ~/app
            cd ~/app

            # Pull latest code (idempotent: init if not a git repo)
            if [ ! -d .git ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git reset --hard origin/main
            fi

            # Install server dependencies
            cd server
            npm install --omit=dev

            # Restart server using PM2 (idempotent: start or reload)
            if pm2 describe devops-server > /dev/null 2>&1; then
              pm2 reload devops-server
            else
              pm2 start src/index.js --name devops-server
            fi

            pm2 save
            echo "Deployment completed successfully"
