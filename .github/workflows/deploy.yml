name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Navigate to the application directory (idempotent: create if missing)
            mkdir -p ~/app
            cd ~/app

            # Pull latest code (idempotent: init if not a git repo)
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # Install server dependencies
            cd server
            npm install --omit=dev

            # Restart server using PM2 (idempotent: start or reload)
            if pm2 describe devops-server > /dev/null 2>&1; then
              pm2 reload devops-server
            else
              pm2 start src/index.js --name devops-server
            fi

            pm2 save
            echo "Deployment completed successfully"
